<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <title>{{ settings.site_name|default:"NL Makeover" }} Luxury Beauty Parlour & Bridal Studio</title>
    <meta name="description" content="NL Makeover in Bahraich is your ultimate luxury beauty parlour and bridal studio offering professional bridal makeup, advanced skin treatments, hair styling, and glamorous makeovers by expert stylists. Book your appointment today!">
    
    <!-- Common Head Include -->
    {% include 'salon/head.html' %}
</head>
<body class="bg-stone-950 text-stone-100 font-sans selection:bg-amber-500 selection:text-stone-950" oncontextmenu="return false;">

    <!-- Header Include -->
    {% include 'salon/header.html' %}

    <!-- Banner Include -->
    {% include 'salon/banner.html' %}

    <!-- Hero Section Include -->
    {% include 'salon/hero.html' %}

    <!-- Services Section Include -->
    {% include 'salon/services.html' %}

    <!-- Gallery / Reels Section Include -->
    {% include 'salon/gallery.html' %}

    <!-- Footer Include -->
    {% include 'salon/footer.html' %}

    <!-- Flowbite JS for Carousel Interactive Controls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.js"></script>

    <!-- Anti-Copy & Anti-Inspect JS Protection -->
    <script>
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('copy', e => e.preventDefault());
        document.addEventListener('cut', e => e.preventDefault());
        document.addEventListener('keydown', function (e) {
            if (e.keyCode === 123 || (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74)) || (e.ctrlKey && (e.keyCode === 85 || e.keyCode === 67 || e.keyCode === 65 || e.keyCode === 83))) {
                e.preventDefault();
                return false;
            }
        });
    </script>
</body>
</html>
