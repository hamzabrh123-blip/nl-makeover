    <!-- Anti-Copy CSS Protection -->
    <style>
        /* Disable text selection across all elements */
        body, html {
            -webkit-user-select: none; /* Safari */
            -ms-user-select: none; /* IE 10 and IE 11 */
            user-select: none; /* Standard syntax */
        }
        /* Disable image drag & drop */
        img {
            -webkit-user-drag: none;
            -khtml-user-drag: none;
            -moz-user-drag: none;
            -o-user-drag: none;
            user-drag: none;
            pointer-events: none; /* Disables right click / save image directly */
        }
    </style>

    </script>

    <!-- Anti-Copy & Anti-Inspect JS Protection -->
    <script>
        // Disable Right Click
        document.addEventListener('contextmenu', function (e) {
            e.preventDefault();
        });

        // Disable Copy, Cut, Paste
        document.addEventListener('copy', function (e) {
            e.preventDefault();
        });
        document.addEventListener('cut', function (e) {
            e.preventDefault();
        });

        // Disable Common Keyboard Shortcuts (Ctrl+C, Ctrl+U, Ctrl+S, Ctrl+Shift+I, F12)
        document.addEventListener('keydown', function (e) {
            // F12 key
            if (e.keyCode === 123) {
                e.preventDefault();
                return false;
            }
            // Ctrl+Shift+I / Cmd+Option+I (Inspect)
            if (e.ctrlKey && e.shiftKey && e.keyCode === 73) {
                e.preventDefault();
                return false;
            }
            // Ctrl+Shift+J / Cmd+Option+J (Console)
            if (e.ctrlKey && e.shiftKey && e.keyCode === 74) {
                e.preventDefault();
                return false;
            }
            // Ctrl+U (View Source)
            if (e.ctrlKey && e.keyCode === 85) {
                e.preventDefault();
                return false;
            }
            // Ctrl+C (Copy)
            if (e.ctrlKey && e.keyCode === 67) {
                e.preventDefault();
                return false;
            }
            // Ctrl+A (Select All)
            if (e.ctrlKey && e.keyCode === 65) {
                e.preventDefault();
                return false;
            }
            // Ctrl+S (Save)
            if (e.ctrlKey && e.keyCode === 83) {
                e.preventDefault();
                return false;
            }
        });
    </script>
</body>
