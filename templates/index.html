<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="zDQvh5QxjLRGGZkgvNN6Gf7wW-o7dEwXhPQhSjXOJUw" />
    <title>{{ settings.site_name|default:"NL Makeover" }} Luxury Beauty Parlour & Bridal Studio</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Flowbite Carousel CSS/JS for Smooth Slider -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css" rel="stylesheet" />

    <!-- Google Structured Data (JSON-LD Schema) for NL Makeover -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "BeautySalon",
      "name": "NL Makeover",
      "image": "{{ request.scheme }}://{{ request.get_host }}/static/images/logo.png",
      "@id": "{{ request.scheme }}://{{ request.get_host }}/#salon",
      "url": "{{ request.scheme }}://{{ request.get_host }}/",
      "telephone": "+91-9876543210",
      "priceRange": "₹₹",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Main Road",
        "addressLocality": "Bahraich",
        "addressRegion": "UP",
        "postalCode": "271801",
        "addressCountry": "IN"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": 27.575,
        "longitude": 81.595
      },
      "openingHoursSpecification": {
        "@type": "OpeningHoursSpecification",
        "dayOfWeek": [
          "Monday",
          "Tuesday",
          "Wednesday",
          "Thursday",
          "Friday",
          "Saturday",
          "Sunday"
        ],
        "opens": "09:00",
        "closes": "20:00"
      },
      "sameAs": [
        "https://www.instagram.com/",
        "https://www.facebook.com/"
      ]
    }
    </script>
</head>
<body class="bg-stone-950 text-stone-100 font-sans selection:bg-amber-500 selection:text-stone-950">

    <!-- Header Include -->
    {% include 'salon/header.html' %}

    <!-- Banner Include -->
    {% include 'salon/banner.html' %}

    <!-- Hero Section Include -->
    {% include 'salon/hero.html' %}

    <!-- Services Section Include -->
    {% include 'salon/services.html' %}

    <!-- Gallery / Reels Section Include -->
    {% include 'salon/gallery.html' %}

    <!-- Footer Include -->
    {% include 'salon/footer.html' %}

    <!-- Flowbite JS for Carousel Interactive Controls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.js"></script>
</body>
</html>
