<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Google Search Console & Pinterest Verification -->
<meta name="google-site-verification" content="zDQvh5QxjLRGGZkgvNN6Gf7wW-o7dEwXhPQhSjXOJUw" />
<meta name="p:domain_verify" content="0c18efd1ad55611d286fbd71d462ec46"/>

<!-- Google AdSense -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3171847065256414" crossorigin="anonymous"></script>
<meta name="google-adsense-account" content="ca-pub-3171847065256414">

<!-- Dynamic Page Title (58 chars default) -->
<title>{% block meta_title %}{{ settings.meta_title|default:"NL Makeover Bahraich | Beauty Parlour, Bridal Makeup & Hair" }}{% endblock %}</title>

<!-- Dynamic Meta Description & Keywords Managed from Admin Site & App Settings -->
<meta name="description" content='{% block meta_description %}{{ settings.meta_description|default:"NL Makeover in Bahraich is a trusted beauty parlour & makeover studio for bridal makeup, hair spa, skin treatments, and salon care. Check reviews & book today!" }}{% endblock %}'>
<meta name="keywords" content='{% block meta_keywords %}{{ settings.meta_keywords|default:"Beauty Parlour in Bahraich, Bridal Makeup Artist in Bahraich, Hair Botox in Bahraich, Hair Spa in Bahraich, Keratin Treatment in Bahraich, Hydra Facial in Bahraich, Hair Color in Bahraich, Party Makeup in Bahraich, Beauty Academy in Bahraich, NL Makeover" }}{% endblock %}'>

<!-- Canonical URL -->
<link rel="canonical" href="{{ request.scheme }}://{{ request.get_host }}{{ request.path }}">

<!-- Tab Icon / Favicon -->
{% if settings.logo %}
<link rel="icon" type="image/x-icon" href="{{ settings.logo.url }}">
<link rel="shortcut icon" href="{{ settings.logo.url }}">
{% endif %}

<!-- Open Graph / Facebook / WhatsApp Meta Tags -->
<meta property="og:type" content="website">
<meta property="og:url" content="{{ request.scheme }}://{{ request.get_host }}{{ request.path }}">
<meta property="og:title" content="{% block og_title %}{{ settings.meta_title|default:'NL Makeover Bahraich | Beauty Parlour, Bridal Makeup & Hair' }}{% endblock %}">
<meta property="og:description" content="{% block og_description %}{{ settings.meta_description|default:'NL Makeover in Bahraich is a trusted beauty parlour & makeover studio for bridal makeup, hair spa, skin treatments, and salon care. Check reviews & book today!' }}{% endblock %}">
<meta property="og:image" content="https://res.cloudinary.com/dvoqsrkkq/image/upload/v1792176767/banners/Gemini_Generated_Image_r6l4jdr6l4jdr6l4_result_e4zb8h.webp">

<!-- Twitter Card Meta Tags -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:url" content="{{ request.scheme }}://{{ request.get_host }}{{ request.path }}">
<meta name="twitter:title" content="{% block twitter_title %}{{ settings.meta_title|default:'NL Makeover Bahraich | Beauty Parlour, Bridal Makeup & Hair' }}{% endblock %}">
<meta name="twitter:description" content="{% block twitter_description %}{{ settings.meta_description|default:'NL Makeover in Bahraich is a trusted beauty parlour & makeover studio for bridal makeup, hair spa, skin treatments, and salon care. Check reviews & book today!' }}{% endblock %}">
<meta name="twitter:image" content="https://res.cloudinary.com/dvoqsrkkq/image/upload/v1792176767/banners/Gemini_Generated_Image_r6l4jdr6l4jdr6l4_result_e4zb8h.webp">

<!-- Tailwind CSS CDN & FontAwesome -->
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<!-- Flowbite Carousel CSS -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css" rel="stylesheet" />

<!-- Anti-Copy CSS Protection -->
<style>
    body, html {
        -webkit-user-select: none;
        -ms-user-select: none;
        user-select: none;
    }
    img {
        -webkit-user-drag: none;
        user-drag: none;
    }
</style>

<!-- Google Structured Data (JSON-LD Schema) -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BeautySalon",
  "name": "{{ settings.site_name|default:'NL Makeover' }}",
  "image": "{% if settings.logo %}{{ settings.logo.url }}{% else %}{{ request.scheme }}://{{ request.get_host }}/static/images/logo.png{% endif %}",
  "@id": "{{ request.scheme }}://{{ request.get_host }}/#salon",
  "url": "{{ request.scheme }}://{{ request.get_host }}/",
  "telephone": "+91-{{ settings.phone_number|default:'9170112725' }}",
  "priceRange": "₹₹",
  "address": {
    "@type": "PostalAddress",
    "streetAddress": "Court Road",
    "addressLocality": "Bahraich",
    "addressRegion": "UP",
    "postalCode": "271801",
    "addressCountry": "IN"
  },
  "geo": {
    "@type": "GeoCoordinates",
    "latitude": 27.5758,
    "longitude": 81.5956
  },
  "openingHoursSpecification": {
    "@type": "OpeningHoursSpecification",
    "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"],
    "opens": "09:00",
    "closes": "20:00"
  },
  "sameAs": [
    "{{ settings.instagram_url|default:'https://www.instagram.com/' }}",
    "{{ settings.facebook_url|default:'https://www.facebook.com/' }}"
  ]
}
</script>
